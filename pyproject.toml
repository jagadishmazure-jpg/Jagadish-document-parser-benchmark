[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-parser-benchmark"
version = "0.1.0"
description = "Head-to-head benchmark of simulated document parsers, with quality gates that block downstream action on poor parses."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
